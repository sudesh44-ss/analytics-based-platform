name: CI Pipeline

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  verify-and-test:
    name: Lint, Test & Build Monorepo
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Monorepo Dependencies
        run: npm ci

      - name: Verify Monorepo Structure & Assets
        run: npm run verify

      - name: Validate Database Migrations
        run: npm run db:migrate

      - name: TypeScript Typecheck All Workspaces
        run: npm run typecheck

      - name: Execute Automated Unit & Integration Tests
        run: npm run test

      - name: Build Next.js Frontend & TypeScript Services
        run: npm run build
